# ==========================================================
# TuMags Reduction Pipeline Configuration (YAML)
# ==========================================================
# Example:
#   python3 ../../TuMags_Reduction_Pipeline/process_data_main.py \
#       -f ../../TuMags_Reduction_Pipeline/config_tumag.yaml
#
# IMPORTANT:
# - Parameter names must be unique (no duplicates across levels).
# - Boolean and None keywords are lowercase: false, true, none
# - results can be checked using python3 visor.py /Volumes/TuMag_d1/reduccion/.../file.fits
# ==========================================================


# ----------------------------------------------------------
# GLOBAL PARAMETERS
# ----------------------------------------------------------

obs_ID: "comm1"                   # Observation ID. In process_data_timelines.py (add new one if it does not exist)
proc_version: "0.3" # con cross-talk standard

process_line: "2.02"              # Observation mode to process
# process_line: "1"              # Observation mode to process

process_ocs: "0:20"                  # ":" -> all, or range, or single ID
process_files: "0:10"                # ":" -> all, or range, or single ID
# process_files: 2
process_ocs: "0:2"                  # ":" -> all, or range, or single ID
process_files: "0"                # ":" -> all, or range, or single ID

parallel: false 
max_workers: 3

tumag_data_location: "./"         # Path to Organized_files_local folder
# Organized_files_local_folder_name: "Organized_files_TuMag_d2"
Organized_files_local_folder_name: "Organized_files_local"

output_folder: "/Volumes/TuMag_d5/reduccion/"   # Output results folder


# ----------------------------------------------------------
# REPROCESSING OPTIONS
# ----------------------------------------------------------
force_redo:
  redo_flat: true                # Recalculate flats
  redo_dark: true                # Recalculate darks
  level0_5: true
  level0_7: true
  level1_0: true
  level1_1: false


# ----------------------------------------------------------
# PLOTTING OPTIONS
# ----------------------------------------------------------
plots:
  plot_darks: false
  plot_flats: false
  plot_level0_5: true
  plot_level0_7: true
  plot_level1_0: true
  plot_level1_1: true
  roi_plots: [200, -200, 200, -200]


# ----------------------------------------------------------
# DARK AND FLAT OPTIONS
# ----------------------------------------------------------
darks_indexes:
  dark_from:
  dark_to: -2

dark_file: false # npy with the dark (optinonal) 

flat_file: '' #"/Volumes/TuMag_d5/reduccion/04_QSUN_QS8/D11-44410-46201_processed.npz"
flat_norm_roi: [250, -250, 250, -250]  # sugerido por Fbailen (toda la imagen, pero sin mascara)
import_blueshift_guess: True
norm_method: "blueshift" # avg, mod 
remove_prefilter: True
pref_model: True

# ----------------------------------------------------------
# LEVEL 0.5 OPTIONS
# ----------------------------------------------------------
level_05:
  filtering: true                 # Remove high-frequency content
  save_level_05: true             # Save processed level 0.5 data

size: 2016
centro: [973, 996]               # [size // 2 - 35, size // 2 - 12]
corte: 800


# ----------------------------------------------------------
# LEVEL 0.7 OPTIONS
# ----------------------------------------------------------
level_07:
  align_mode: "fourier"           # "fourier" or "destretch"
  align_roi: [0,-1,0,-1]
  align_accuracy: 0.001
  align_rot_data_filter: "pinholes_results.csv"   # e.g. "pinholes_Fe2.02.csv"
  align_quadrants: 0
  align_order: 0
  # 0: Align modulations in cam 0 and then cam 1 w.r.t cam 0
  # 1: Align modulations in both cams, then cam 1 w.r.t cam 0 (global ROI)
  # 2: Align modulations in both cams, then cam 1 w.r.t cam 0 (quadrants)
  destretch_n_iterations: 200
  destretch_aling_cam: 'all'
  destretch_ngrid: 8
  destretch_lr: 0.1
  destretch_lambda_tt: 0.02
  add_level_07_label: '' #'dt' 
  demod_matrix: 'demod_matrices_david'

# ----------------------------------------------------------
# LEVEL 1.0 OPTIONS
# ----------------------------------------------------------
level_10:
  crosst_mode: "jaeggli"         # "jaeggli" or "standard"
  crosst_roi: [200,-200,200,-200]      # Normalization region
  crosst_region: [200,-200,200,-200]   # Crosstalk calculation region
  crosst_threshold:  0.01 # Single (only V, or three array,list (for QUV independent))
  crosst_intensity_threshold: 0.8 # 0.01 thersshold for avoid umbra (intensity). 0 means not used
  crosst_last_wave: -1 #used -1 for standard and -2 for jaeggli
  crosst_quadrants: 0
  crosst_interference: 0 #8          # or 'comm1_cal.npz' file
  mmatrix: 0
  normalization: 0
  plot_crosst_method: false
  crosst_verbose: false
  add_level_10_label: '' # '_inter8'


# ----------------------------------------------------------
# LEVEL 1.1 OPTIONS
# ----------------------------------------------------------
zernike_id: "01_QSUN_Fe2.02" #"06_SPOT_Fe2.02_0"


